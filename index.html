    <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-auth.js"></script>

    <script>
      var firebaseConfig = {
        apiKey: "AIzaSyBFzRkzMpJjzVNb_F8QkeK2SvG7PKwqaSs",
        authDomain: "capeline-2025.firebaseapp.com",
        projectId: "capeline-2025",
        storageBucket: "capeline-2025.firebasestorage.app",
        messagingSenderId: "859781491770",
        appId: "1:859781491770:web:d85f35735dd7f464c89903",
      };
      
      // Initialize Firebase
      firebase.initializeApp(firebaseConfig);

      // This single function handles both the redirect logic and the Sign Out button visibility
      function checkAuthState() {
        firebase.auth().onAuthStateChanged(function (user) {
          const signOutBtn = document.getElementById('signOutBtn');

          if (!user) {
            // 1. If user is NOT signed in, force redirect to login screen
            window.location.href = "login.html";
          } else {
            // 2. If user IS signed in, show the Sign Out button
            if (signOutBtn) {
              signOutBtn.classList.remove('hidden');
            }
          }
        });

        // 3. Set up the click action for the Sign Out button safely
        const signOutBtn = document.getElementById('signOutBtn');
        if (signOutBtn) {
          signOutBtn.addEventListener('click', function (e) {
            e.preventDefault(); 
            
            // This securely ends the user session in Firebase
            firebase.auth().signOut().then(function() {
              window.location.href = "login.html"; 
            }).catch(function(error) {
              alert("Error signing out: " + error.message);
            });
          });
        }
      }
    </script>
  </head>
